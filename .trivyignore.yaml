vulnerabilities:
  - id: CVE-2026-56852
    paths:
      - "usr/local/bin/rclone"
    expired_at: 2026-11-30
    statement: >-
      rclone 1.75.0 embeds golang.org/x/text. The bridge invokes rclone only
      against the administrator's configured Dropbox account.
  - id: GHSA-hrxh-6v49-42gf
    paths:
      - "usr/local/bin/rclone"
    expired_at: 2026-11-30
    statement: >-
      rclone 1.75.0 embeds the affected gRPC library, but the bridge only runs
      the rclone CLI for Dropbox operations without enabling gRPC/xDS.
