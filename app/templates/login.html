<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Wahoo to Garmin Bridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="mx-auto border rounded bg-white p-4" style="max-width: 420px;">
        <h1 class="h4 mb-3">Wahoo to Garmin Bridge</h1>
        {% if error %}
        <div class="alert alert-warning">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
      </div>
    </main>
  </body>
</html>
