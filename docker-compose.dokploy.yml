services:
  volume-permissions:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python", "-m", "app.volume_permissions"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - bridge_data:/data
      - bridge_appdata:/appdata
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    restart: "no"

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
      - path: /appdata/runtime.env
        required: false
    volumes:
      - bridge_data:/data
      - bridge_appdata:/appdata
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bridge_data:
  bridge_appdata:
