name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - run: bandit -q -ll -r app
      - run: pip-audit
      - run: docker build -t wahoo-garmin-fit-bridge:ci .
      - name: Scan container for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "wahoo-garmin-fit-bridge:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore.yaml"
      - name: Scan deployment configuration
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "config"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore.yaml"
